# =============================================================================
# 商家端 Web（ml-express-merchant-web）— Netlify
#
# 若仓库为 monorepo：在 Netlify → Site → Site configuration → Build & deploy
#   · Base directory: ml-express-merchant-web
#   · Build command: 可留空（使用本文件）或同下方 command
#   · Publish directory: build（与 Base 搭配时为 ml-express-merchant-web/build 由 Netlify 自动处理）
#
# 环境变量：见本目录 .env.example（含 Functions 用密钥，在 Netlify 后台设置，不要提交到 Git）
# CLI 生产发布（需已登录 netlify login，且 site id 与团队一致）：
#   cd ml-express-merchant-web && npm run deploy:netlify
# =============================================================================
[build]
  command = "npm install --legacy-peer-deps && CI=false npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NETLIFY_SKIP_PLUGINS = "true"
  # CLI `netlify deploy --build` 默认 context=dev，必须写在 build.environment 才会生效。
  # 前端包会打入 anon / Maps 公钥，属预期；勿把 service role / Twilio / Gmail 加进 OMIT。
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "REACT_APP_SUPABASE_ANON_KEY,REACT_APP_SUPABASE_URL,REACT_APP_GOOGLE_MAPS_API_KEY"

# 勿用 releases/latest：若最新 Release 未附带 ml-express-merchants.apk 会 404。
# 发布新版商家 APK 后请上传到 GitHub 并改为对应 tag，或恢复为 latest（且保证附件存在）。
[[redirects]]
  from = "/download"
  to = "https://github.com/huangdelun16-lgtm/ml-express/releases/download/v.2.1.1-merchants/ml-express-merchants.apk"
  status = 302
  force = true

[[redirects]]
  from = "/__sb/*"
  to = "https://uopkyuluxnrewvlmutam.supabase.co/:splat"
  status = 200
  force = true

# 商家 App 登录：缅甸打不通 *.netlify.app，走本站可达域名代理到管理后台 function。
# 若本站已部署 merchant-password function，Netlify 会优先命中 function。
[[redirects]]
  from = "/.netlify/functions/merchant-password"
  to = "https://admin-market-link-express.netlify.app/.netlify/functions/merchant-password"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[context.production.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[context.deploy-preview.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[context.branch-deploy.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
