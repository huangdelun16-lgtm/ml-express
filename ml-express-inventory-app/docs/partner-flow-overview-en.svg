<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" font-family="Arial, Helvetica, sans-serif">
  <rect width="920" height="320" fill="#0f172a" rx="12"/>
  <text x="460" y="32" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="bold">ML Inventory - Cross-Border Workflow</text>
  <text x="460" y="52" text-anchor="middle" fill="#94a3b8" font-size="12">Multi-hub partner operations | MARKET LINK EXPRESS</text>
  <rect x="24" y="72" width="280" height="200" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="164" y="96" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">ORIGIN HUB A</text>
  <text x="164" y="112" text-anchor="middle" fill="#64748b" font-size="10">e.g. MUSE</text>
  <rect x="44" y="124" width="110" height="44" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="99" y="144" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">1 Stock in</text>
  <text x="99" y="158" text-anchor="middle" fill="#94a3b8" font-size="9">Scan and register</text>
  <rect x="164" y="124" width="110" height="44" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="219" y="144" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">2 Express items</text>
  <text x="219" y="158" text-anchor="middle" fill="#94a3b8" font-size="9">Order list</text>
  <line x1="154" y1="146" x2="164" y2="146" stroke="#64748b" marker-end="url(#a)"/>
  <rect x="44" y="184" width="110" height="44" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="99" y="204" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">3 Pack PKG</text>
  <text x="99" y="218" text-anchor="middle" fill="#94a3b8" font-size="9">Create package</text>
  <rect x="164" y="184" width="110" height="44" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="219" y="204" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">4 Truck load</text>
  <text x="219" y="218" text-anchor="middle" fill="#94a3b8" font-size="9">Fee + destination</text>
  <line x1="99" y1="168" x2="99" y2="184" stroke="#64748b"/>
  <line x1="219" y1="168" x2="219" y2="184" stroke="#64748b"/>
  <rect x="330" y="130" width="120" height="84" rx="12" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
  <text x="390" y="172" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="bold">IN TRANSIT</text>
  <text x="390" y="192" text-anchor="middle" fill="#94a3b8" font-size="10">Cloud sync</text>
  <line x1="304" y1="206" x2="330" y2="172" stroke="#64748b"/>
  <rect x="476" y="72" width="420" height="200" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="686" y="96" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="bold">TRANSIT / DESTINATION HUB B</text>
  <rect x="496" y="114" width="115" height="48" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="553" y="134" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">5 Hub receive</text>
  <text x="553" y="150" text-anchor="middle" fill="#94a3b8" font-size="9">Scan PKG barcode</text>
  <rect x="626" y="114" width="115" height="48" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="683" y="134" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">6 Inbound</text>
  <text x="683" y="150" text-anchor="middle" fill="#94a3b8" font-size="9">Every order in PKG</text>
  <rect x="496" y="178" width="115" height="48" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="553" y="198" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">7 Re-pack</text>
  <text x="553" y="214" text-anchor="middle" fill="#94a3b8" font-size="9">If transit order</text>
  <rect x="626" y="178" width="115" height="48" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="683" y="198" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">8 Complete</text>
  <text x="683" y="214" text-anchor="middle" fill="#94a3b8" font-size="9">Pay fee / delivery</text>
  <rect x="756" y="146" width="120" height="48" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="816" y="166" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">4 Truck load</text>
  <text x="816" y="182" text-anchor="middle" fill="#94a3b8" font-size="9">Send to next hub</text>
  <line x1="611" y1="138" x2="626" y2="138" stroke="#64748b"/>
  <line x1="611" y1="202" x2="756" y2="170" stroke="#64748b" stroke-dasharray="4"/>
  <text x="553" y="248" text-anchor="middle" fill="#64748b" font-size="9">Transit: re-pack and truck load again</text>
  <text x="740" y="248" text-anchor="middle" fill="#64748b" font-size="9">Final hub: pay fee and complete</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs>
  <text x="460" y="300" text-anchor="middle" fill="#64748b" font-size="10">Figure 1 | ML Inventory v1.2.1</text>
</svg>