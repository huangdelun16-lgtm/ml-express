<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="140" fill="#0f172a" rx="12"/>
  <text x="450" y="28" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">Stock In - 3 Steps</text>
  <rect x="40" y="48" width="240" height="72" rx="10" fill="#1e293b" stroke="#34d399"/>
  <text x="160" y="72" text-anchor="middle" fill="#34d399" font-weight="bold">Step 1 Scan</text>
  <text x="160" y="90" text-anchor="middle" fill="#f8fafc" font-size="11">Express label / inbound barcode</text>
  <text x="160" y="106" text-anchor="middle" fill="#94a3b8" font-size="10">Optional - manual entry OK</text>
  <rect x="330" y="48" width="240" height="72" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="450" y="72" text-anchor="middle" fill="#38bdf8" font-weight="bold">Step 2 Customer</text>
  <text x="450" y="90" text-anchor="middle" fill="#f8fafc" font-size="11">Name, phone, destination</text>
  <text x="450" y="106" text-anchor="middle" fill="#94a3b8" font-size="10">Product, weight, quantity</text>
  <rect x="620" y="48" width="240" height="72" rx="10" fill="#1e293b" stroke="#a78bfa"/>
  <text x="740" y="72" text-anchor="middle" fill="#a78bfa" font-weight="bold">Step 3 Fees</text>
  <text x="740" y="90" text-anchor="middle" fill="#f8fafc" font-size="11">COD / prepaid, cross-border fee</text>
  <text x="740" y="106" text-anchor="middle" fill="#94a3b8" font-size="10">Confirm - print label</text>
  <line x1="280" y1="84" x2="330" y2="84" stroke="#34d399" stroke-width="2"/>
  <line x1="570" y1="84" x2="620" y2="84" stroke="#34d399" stroke-width="2"/>
  <text x="450" y="132" text-anchor="middle" fill="#64748b" font-size="10">Result: order appears in Express items</text>
</svg>