<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="420" fill="#0f172a" rx="12"/>
  <text x="450" y="36" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">Hub Receive - Step by Step</text>
  <text x="450" y="58" text-anchor="middle" fill="#a78bfa" font-size="13">Most important flow for destination / transit hubs</text>
  <rect x="340" y="78" width="220" height="52" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="450" y="100" text-anchor="middle" fill="#38bdf8" font-weight="bold">1. Open app and sign in</text>
  <text x="450" y="118" text-anchor="middle" fill="#94a3b8" font-size="11">Home - Hub receive</text>
  <line x1="450" y1="130" x2="450" y2="148" stroke="#38bdf8" stroke-width="2"/>
  <rect x="300" y="150" width="300" height="52" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="450" y="172" text-anchor="middle" fill="#f8fafc" font-weight="bold">2. Scan barcode</text>
  <text x="450" y="190" text-anchor="middle" fill="#94a3b8" font-size="11">PKG package number OR inbound order barcode</text>
  <line x1="450" y1="202" x2="450" y2="220" stroke="#38bdf8" stroke-width="2"/>
  <rect x="280" y="222" width="340" height="52" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="450" y="244" text-anchor="middle" fill="#f8fafc" font-weight="bold">3. Confirm hub receive</text>
  <text x="450" y="262" text-anchor="middle" fill="#94a3b8" font-size="11">Status: In transit to Received at hub</text>
  <line x1="450" y1="274" x2="450" y2="292" stroke="#38bdf8" stroke-width="2"/>
  <rect x="260" y="294" width="380" height="52" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="450" y="316" text-anchor="middle" fill="#fbbf24" font-weight="bold">4. Inbound EVERY order in the PKG</text>
  <text x="450" y="334" text-anchor="middle" fill="#94a3b8" font-size="11">Including transit orders - do not skip any</text>
  <line x1="380" y1="346" x2="260" y2="366" stroke="#64748b"/>
  <line x1="520" y1="346" x2="640" y2="366" stroke="#64748b"/>
  <rect x="120" y="366" width="280" height="44" rx="10" fill="#0f172a" stroke="#34d399"/>
  <text x="260" y="386" text-anchor="middle" fill="#34d399" font-weight="bold">Transit orders?</text>
  <text x="260" y="402" text-anchor="middle" fill="#94a3b8" font-size="10">Express items - Re-pack - Truck load</text>
  <rect x="500" y="366" width="280" height="44" rx="10" fill="#0f172a" stroke="#34d399"/>
  <text x="640" y="386" text-anchor="middle" fill="#34d399" font-weight="bold">All done?</text>
  <text x="640" y="402" text-anchor="middle" fill="#94a3b8" font-size="10">Pay transport fee - Complete</text>
  <rect x="24" y="150" width="200" height="120" rx="10" fill="#450a0a" stroke="#f87171"/>
  <text x="124" y="174" text-anchor="middle" fill="#f87171" font-size="11" font-weight="bold">Common mistake</text>
  <text x="124" y="196" text-anchor="middle" fill="#fca5a5" font-size="10">Confirm receive but</text>
  <text x="124" y="212" text-anchor="middle" fill="#fca5a5" font-size="10">forget to inbound</text>
  <text x="124" y="228" text-anchor="middle" fill="#fca5a5" font-size="10">each order inside</text>
  <rect x="676" y="150" width="200" height="120" rx="10" fill="#052e16" stroke="#34d399"/>
  <text x="776" y="174" text-anchor="middle" fill="#34d399" font-size="11" font-weight="bold">Checklist</text>
  <text x="776" y="198" text-anchor="middle" fill="#86efac" font-size="10">Scan PKG</text>
  <text x="776" y="214" text-anchor="middle" fill="#86efac" font-size="10">Confirm receive</text>
  <text x="776" y="230" text-anchor="middle" fill="#86efac" font-size="10">Inbound all orders</text>
  <text x="776" y="246" text-anchor="middle" fill="#86efac" font-size="10">Pay fee</text>
</svg>