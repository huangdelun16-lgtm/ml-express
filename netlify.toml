# =============================================================================
# Admin Web（仓库根目录 React 应用；勿与 ml-express-merchant-web 等子目录站点混用）
# Netlify：Base directory 留空；Build/Publish 可留空（由本文件指定）
# 环境变量：根目录 .env.example；Functions 密钥见 netlify/functions/*.js
# CLI：仓库根目录 npx netlify login && npm run deploy:netlify（site id 须与账号一致）
# =============================================================================

[build]
  command = "npm install --legacy-peer-deps && CI=false npm run build"
  publish = "build"
  functions = "netlify/functions"

[[edge_functions]]
  function = "supabase-bff"
  path = "/__sb/*"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NETLIFY_SKIP_PLUGINS = "true"

# SPA重定向配置 - 解决React Router路由问题
[[redirects]]
  from = "/__sb/*"
  to = "https://uopkyuluxnrewvlmutam.supabase.co/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 安全头部配置 - 解决外部音频加载问题
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://maps.googleapis.com https://maps.gstatic.com https://*.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://maps.googleapis.com https://maps.gstatic.com https://*.googleapis.com https://*.gstatic.com; connect-src 'self' https: wss: blob: https://*.workers.dev wss://*.workers.dev https://ml-supabase-proxy.huangdelun16.workers.dev wss://ml-supabase-proxy.huangdelun16.workers.dev; media-src 'self' https: data: blob: https://assets.mixkit.co; img-src 'self' data: https: blob:; font-src 'self' https: data:; frame-src 'self' https: https://www.google.com https://maps.google.com https://maps.googleapis.com; worker-src 'self' blob:; child-src 'self' blob: https://maps.googleapis.com;"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 禁用密钥扫描以避免误报
[build.processing]
  skip_processing = false

# 密钥扫描配置
[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

# 忽略密钥扫描的文件模式
[build.processing.skip]
  paths = ["*.md", "*.html", "test-*", "diagnose-*"]

# 骑手送达证明图：每天 UTC 04:00 清理超过 7 天的 delivery_photos
[functions."cleanup-delivery-photos"]
  schedule = "0 4 * * *"

# 环境变量
# 注意：敏感信息（如 Supabase 密钥）应在 Netlify Dashboard 中配置
# Dashboard 中的环境变量优先级高于此文件中的配置
# 访问：Site settings → Environment variables

[context.production.environment]
  # Google Maps API Key（如果需要在 netlify.toml 中配置）
  # REACT_APP_GOOGLE_MAPS_API_KEY = "your-key-here"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[context.deploy-preview.environment]
  # REACT_APP_GOOGLE_MAPS_API_KEY = "your-key-here"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[context.branch-deploy.environment]
  # REACT_APP_GOOGLE_MAPS_API_KEY = "your-key-here"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"