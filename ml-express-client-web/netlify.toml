# =============================================================================
# 客户端 Web（C 端 market-link-express.com 等）
# -----------------------------------------------------------------------------
# Netlify：Base directory = ml-express-client-web（本文件所在目录）
# 环境变量：REACT_APP_SUPABASE_*、REACT_APP_GOOGLE_MAPS_API_KEY 及 Functions 所需密钥
# CLI（在本目录下且已 link 到对应站点）：npm run deploy:netlify
# =============================================================================
[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"
  NETLIFY_SKIP_PLUGINS = "true"
  CI = "false"
  # CLI `netlify deploy --build` 默认 context=dev，必须写在 build.environment 才会生效。
  # 前端包会打入 anon / Maps 公钥，属预期；勿把 service role / Twilio / Gmail 加进 OMIT。
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "REACT_APP_SUPABASE_ANON_KEY,REACT_APP_SUPABASE_URL,REACT_APP_GOOGLE_MAPS_API_KEY,REACT_APP_SENTRY_DSN"

# SPA重定向配置 - 解决React Router路由问题
[[redirects]]
  from = "/download"
  to = "https://github.com/huangdelun16-lgtm/ml-express/releases/latest/download/ml-express.apk"
  status = 302
  force = true

[[redirects]]
  from = "/download-rider"
  to = "https://github.com/huangdelun16-lgtm/ml-express/releases/latest/download/ml-express-rider.apk"
  status = 302
  force = true

[[redirects]]
  from = "/__sb/*"
  to = "https://uopkyuluxnrewvlmutam.supabase.co/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 缓存控制 - 强制浏览器和CDN获取最新版本
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    X-Content-Type-Options = "nosniff"
    X-Cache-Control = "no-cache"

# HTML文件绝对不缓存
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    X-Content-Type-Options = "nosniff"

# JS和CSS文件 - 虽然文件名包含hash，但为了确保Safari更新，也设置不缓存
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

# 必须写在 /* 之后：Netlify 后匹配规则覆盖前者。Storage 图若 no-store，
# 缅甸每次进商场都重拉代理，稍抖就是白块。App 同城商场也走本站 /__sb。
[[headers]]
  for = "/__sb/storage/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    Access-Control-Allow-Origin = "*"

# 环境变量
# 注意：敏感信息（如 Supabase 密钥）应在 Netlify Dashboard 中配置
# Dashboard 中的环境变量优先级高于此文件中的配置
# 访问：Site settings → Environment variables

[context.production.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[context.deploy-preview.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[context.branch-deploy.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

